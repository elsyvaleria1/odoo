[pytest]
# The pytest suites under tests/ run from the repo root (the dir holding this
# file), which is where `pythonpath = .` and `testpaths` resolve:
#
#     pytest                      # every suite under tests/
#     pytest tests/transport      # one of them
#
# tests/transport is the one database-free suite (the HTTP/1.1 parser and the
# servers over real sockets, no PostgreSQL); every other one needs real
# dependencies -- PostgreSQL, psql, pg_dump, a booted odoo-bin.
#
# Started from a parent directory instead, pytest collects the tree as plain
# files and fails en masse rather than skipping quietly.
#
# import-mode=importlib lets each test file import independently (no
# __init__.py in the suites, no same-basename collisions) and must be an addopts
# CLI arg -- it has to be active before conftest.py is imported.
addopts = --import-mode=importlib
pythonpath = .

# Name the test that stopped finishing instead of hanging in silence. A
# one-token regression in a wall-clock bound -- tests/process boots real servers
# and waits on them -- turns the bound into an unbounded loop, and the suite
# then never terminates rather than failing.
#
# pytest's built-in faulthandler DUMPS every thread's traceback at this deadline
# and lets the run continue; it does not kill the test.  So this buys attribution,
# not termination -- terminating would need pytest-timeout, a new pinned
# dependency (see doc/coding_guidelines.rst, "The ratchets", on why the dev pins
# are load-bearing).  Attribution alone turns 20 minutes of silence into
# "this test, this line".
#
# 300s is ~40x the slowest test call in any suite (7.2s, tests/process) and ~15x
# the slowest session setup (a real `odoo-bin -i base` in tests/loading), so a
# legitimately slow box does not trip it.  Raise it for one run with
# `-o faulthandler_timeout=N` if it ever does.
faulthandler_timeout = 300
testpaths = tests
