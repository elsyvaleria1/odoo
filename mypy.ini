# Run the package scopes documented in doc/architecture/gates.md. Imports outside
# an explicitly selected scope contribute types without reporting their errors.
[mypy]
python_version = 3.14
follow_imports = silent
ignore_missing_imports = True
namespace_packages = True
explicit_package_bases = True
warn_unused_configs = True
show_error_codes = True
show_column_numbers = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True
check_untyped_defs = True

# Require complete signatures in all eight production framework packages.
[mypy-odoo.orm.*,odoo.db.*,odoo.libs.*,odoo.http.*,odoo.service.*,odoo.modules.*,odoo.tools.*,odoo.cli.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-odoo.orm.*]
warn_return_any = True
disallow_any_generics = True

# Foundational APIs preserve generics and reject stale local suppressions.
# disallow_untyped_calls remains off: some stdlib operator and dependency stubs
# are untyped. Concrete signatures are checked by tooling/typing/contracts.py.
[mypy-odoo.libs.collections.*,odoo.libs.iteration.*,odoo.libs.func,odoo.libs.lru,odoo.libs.callbacks,odoo.libs.settings,odoo.libs.utils,odoo.libs.debug_log,odoo.libs.http1]
warn_return_any = True
disallow_any_generics = True
warn_unused_ignores = True
disallow_untyped_decorators = True
no_implicit_reexport = True

# Static examples are part of the API contract, including rejected calls.
[mypy-tooling.typing.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True
disallow_any_generics = True
warn_unused_ignores = True
disallow_untyped_decorators = True
no_implicit_reexport = True

# Vendored code is outside the framework's typing contract.
[mypy-odoo.libs._vendor.*]
ignore_errors = True
